services:
  client-backend:
    container_name: dtl-backend
    image: client:0.0.1
    build:
      context: ./dtl/
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8580:8580"
    depends_on:
      service-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8580
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092

  shop:
    container_name: shop-service
    build:
      context: ./shop/
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8480:8480"
    depends_on:
      service-db:
        condition: service_healthy
  #    environment:
  #      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092

  quest-menu:
    container_name: quest-menu-service
    build:
      context: ./questMenu/
      dockerfile: Dockerfile
    network_mode: host
    ports:
      - "8380:8380"
    depends_on:
      service-db:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=localhost:9092

  kafka:
    image: 'bitnami/kafka:latest'
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
    network_mode: host

  service-db:
    container_name: secretshop-db
    image: postgres:14.7-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "secretshop_db" ]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "5432:5432"
    volumes:
      - ./dtl/infrastructure/db/create_db.sql:/docker-entrypoint-initdb.d/create_db.sql
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:7
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  keycloak-db:
    image: postgres
    container_name: keycloak-db
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "15432:15432"
    command:
      - "postgres"
      - "-c"
      - "port=15432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloakuser -d keycloakdb -p 15432" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: bitnami/keycloak:26
    container_name: keycloak
    ports:
      - "8180:8180"
    environment:
      KEYCLOAK_HTTP_PORT: 8180
      KEYCLOAK_HOSTNAME_ADMIN: http://localhost:8180
      KEYCLOAK_HOSTNAME: http://localhost:8180
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_ENABLE_STATISTICS: "true"
      KEYCLOAK_ENABLE_HEALTH_ENDPOINTS: "true"
      KEYCLOAK_DATABASE_NAME: ${POSTGRES_DB}
      KEYCLOAK_DATABASE_VENDOR: postgresql
      KEYCLOAK_DATABASE_SCHEMA: public
      KEYCLOAK_DATABASE_USER: ${POSTGRES_USER}
      KEYCLOAK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DATABASE_HOST: localhost
      KEYCLOAK_DATABASE_PORT: 15432
      KC_LOG_LEVEL: INFO
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./auth/import:/opt/keycloak/data/import
    network_mode: host
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  keycloak-client:
    container_name: keycloak-client
    image: kc-admin-client:0.0.1
    build:
      context: ./keycloak/
      dockerfile: Dockerfile
    ports:
      - "8280:8280"
    network_mode: host
    depends_on:
      keycloak:
        condition: service_healthy

  minio:
    container_name: minio
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  db-data:
  pgadmin-data:
  keycloak_db_data:
  keycloak_data:
  minio-data:
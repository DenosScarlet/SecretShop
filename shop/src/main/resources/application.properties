server.port=8480
spring.application.name=shop
spring.docker.compose.enabled=false
spring.web.resources.static-locations=classpath:/static/

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=shopGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=shop-requests
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.value.default.type=com.secretshop.shop.DTO.ShopRequest
spring.kafka.consumer.properties.spring.json.trusted.packages=com.secretshop.shop.DTO,com.secretShop.dtl.DTO
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000ms
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3